name: 'Paragraphs Bundles Demo'
description: 'Installs Paragraphs Bundles with a starter pb_content demo page that showcases content-safe bundle families.'
type: 'Demo content'

install:
  # Core: the pb_content node type carries menu settings
  # (third_party_settings.menu_ui), so its optional config only installs when
  # menu_ui is enabled — without this the demo node cannot be created.
  - menu_ui
  - paragraphs_bundles
  - paragraph_bundle_content
  - paragraph_bundle_hero
  - paragraph_bundle_layout
  - paragraph_bundle_grid
  - paragraph_bundle_card
  - paragraph_bundle_accordion
  - paragraph_bundle_tabs
  - paragraph_bundle_alert

config:
  # Recipes do not auto-install a module's config/optional entity/field config
  # the way `drush en` does, so the bundle types, the fields the demo content
  # uses, and their view displays must be imported explicitly. Import only what
  # the content needs (no media or other integrations); within each module,
  # types and field storages precede field instances, which precede view
  # displays, so dependencies resolve.
  import:
    paragraphs_bundles:
      - paragraphs.paragraphs_type.simple_bundle
      - field.storage.paragraph.pb_content_body
      - field.storage.paragraph.pb_content_title
      - field.field.paragraph.simple_bundle.pb_content_body
      - field.field.paragraph.simple_bundle.pb_content_title
      - core.entity_view_display.paragraph.simple_bundle.default
    paragraph_bundle_content:
      - node.type.pb_content
      - field.storage.node.pb_content_type_body
      - field.field.node.pb_content.pb_content_type_body
      - core.entity_view_display.node.pb_content.default
    paragraph_bundle_hero:
      - paragraphs.paragraphs_type.hero_bundle
      - field.field.paragraph.hero_bundle.pb_content_body
      - field.field.paragraph.hero_bundle.pb_content_title
      - core.entity_view_display.paragraph.hero_bundle.default
    paragraph_bundle_layout:
      - paragraphs.paragraphs_type.one_column_bundle
      - field.storage.paragraph.pb_content_one_column
      - field.field.paragraph.one_column_bundle.pb_content_one_column
      - field.field.paragraph.one_column_bundle.pb_content_title
      - core.entity_view_display.paragraph.one_column_bundle.default
    paragraph_bundle_grid:
      - paragraphs.paragraphs_type.grid_bundle
      - field.storage.paragraph.pb_content_grid_body
      - field.storage.paragraph.pb_display_grid_breakpoints
      - field.storage.paragraph.pb_display_grid_columns
      - field.storage.paragraph.pb_display_grid_gap
      - field.field.paragraph.grid_bundle.pb_content_grid_body
      - field.field.paragraph.grid_bundle.pb_content_title
      - field.field.paragraph.grid_bundle.pb_display_grid_breakpoints
      - field.field.paragraph.grid_bundle.pb_display_grid_columns
      - field.field.paragraph.grid_bundle.pb_display_grid_gap
      - core.entity_view_display.paragraph.grid_bundle.default
    paragraph_bundle_card:
      - paragraphs.paragraphs_type.card_text_section_bundle
      - paragraphs.paragraphs_type.card_two_columns_bundle
      - field.storage.paragraph.pb_content_card_left
      - field.storage.paragraph.pb_content_card_right
      - field.storage.paragraph.pb_display_card_breakpoints
      - field.storage.paragraph.pb_display_card_layout_two
      - field.field.paragraph.card_text_section_bundle.pb_content_body
      - field.field.paragraph.card_text_section_bundle.pb_content_title
      - field.field.paragraph.card_two_columns_bundle.pb_content_card_left
      - field.field.paragraph.card_two_columns_bundle.pb_content_card_right
      - field.field.paragraph.card_two_columns_bundle.pb_display_card_breakpoints
      - field.field.paragraph.card_two_columns_bundle.pb_display_card_layout_two
      - core.entity_view_display.paragraph.card_text_section_bundle.default
      - core.entity_view_display.paragraph.card_two_columns_bundle.default
    paragraph_bundle_accordion:
      - paragraphs.paragraphs_type.accordion_bundle
      - paragraphs.paragraphs_type.accordion_section_bundle
      - field.storage.paragraph.pb_content_accordion_body
      - field.storage.paragraph.pb_content_accordion_section
      - field.storage.paragraph.pb_content_accordion_title
      - field.field.paragraph.accordion_bundle.pb_content_accordion_section
      - field.field.paragraph.accordion_bundle.pb_content_title
      - field.field.paragraph.accordion_section_bundle.pb_content_accordion_body
      - field.field.paragraph.accordion_section_bundle.pb_content_accordion_title
      - core.entity_view_display.paragraph.accordion_bundle.default
      - core.entity_view_display.paragraph.accordion_section_bundle.default
    paragraph_bundle_tabs:
      - paragraphs.paragraphs_type.tabs_bundle
      - paragraphs.paragraphs_type.tab_section_bundle
      - field.storage.paragraph.pb_content_tab_body
      - field.storage.paragraph.pb_content_tab_name
      - field.storage.paragraph.pb_content_tab_section
      - field.field.paragraph.tab_section_bundle.pb_content_tab_body
      - field.field.paragraph.tab_section_bundle.pb_content_tab_name
      - field.field.paragraph.tabs_bundle.pb_content_tab_section
      - field.field.paragraph.tabs_bundle.pb_content_title
      - core.entity_view_display.paragraph.tabs_bundle.default
      - core.entity_view_display.paragraph.tab_section_bundle.default
    paragraph_bundle_alert:
      - paragraphs.paragraphs_type.alert_bundle
      - field.storage.paragraph.pb_content_alert_body
      - field.field.paragraph.alert_bundle.pb_content_alert_body
      - field.field.paragraph.alert_bundle.pb_content_title
      - core.entity_view_display.paragraph.alert_bundle.default
