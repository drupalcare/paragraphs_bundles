# GitLab CI for drupal.org (git.drupalcode.org).
#
# Authoritative test gate: the drupal.org pipeline stands up a real Drupal,
# installs this module's composer dependencies (drupal/paragraphs, etc.), and
# runs the full quality suite — Composer validate, PHPCS, PHPStan, and PHPUnit
# (Unit + Kernel + Functional + FunctionalJavascript). The drupalci job image
# provides the web server + chromedriver the FunctionalJavascript suite needs.
#
# axe-core is NOT committed to this repository. It is MPL-2.0, which is not
# GPL-2.0-compatible, and drupal.org projects do not vendor third-party
# libraries into git. The phpunit job downloads a pinned release and exports
# PB_AXE_CORE_PATH, which tests/src/Traits/AxeTestTrait.php reads. That trait
# FAILS (rather than skips) when the source is missing and CI is set, so a
# failed download can never masquerade as a green a11y run.
#
# Template docs: https://project.pages.drupalcode.org/gitlab_templates/
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  # cspell is off. It flags the bundle vocabulary (`nmw`, `pmw`, `caro`,
  # `accor`, the `pb__*` tokens) as misspellings, and those strings are stored
  # field values and DOM contracts — a dictionary entry per token would be a
  # list of things nobody may ever correct. Turn this back on together with a
  # `.cspell-project-words.txt`, the way cloudflare_purge does it.
  SKIP_CSPELL: '1'
  # Pin the axe-core release used for accessibility assertions. Bump
  # deliberately — a new minor can introduce new rules and turn a green
  # pipeline red.
  PB_AXE_CORE_VERSION: '4.12.1'
  PB_AXE_CORE_PATH: '/tmp/axe.min.js'
  # TEST THE CORE VERSIONS THIS MODULE CLAIMS. paragraphs_bundles.info.yml
  # declares `^11.3 || ^12`, and the template tests only the CURRENT core
  # version unless a project opts in — so until now half that promise was
  # verified nowhere, on a 2.0.0 that has not shipped yet.
  #
  # TWO SWITCHES PER VARIANT. OPT_IN_TEST_* creates the job; _AUTORUN_* makes
  # it run rather than wait behind a manual prerequisite. Setting only the
  # first gives a green pipeline with no coverage, which is worse than a
  # missing job because it looks fine.
  #
  # `next minor` stays off: there is no next minor to test against today, and a
  # job that cannot run is noise.
  OPT_IN_TEST_PREVIOUS_MINOR: '1'
  _AUTORUN_PREVIOUS_MINOR: 'all'
  OPT_IN_TEST_NEXT_MAJOR: '1'
  _AUTORUN_NEXT_MAJOR: 'all'

# Fetch axe-core before the tests run. Verified against gitlab_templates `main`
# on 2026-08-03: the job is called `phpunit` (there is no
# `phpunit (functional-javascript)`), and neither it nor `.phpunit-base`
# defines a `before_script`, so this adds one rather than replacing the
# template's own setup.
#
# The core-version variants (`phpunit (next minor)` and friends) are opt-in and
# currently off; give them the same before_script when any is enabled, or their
# a11y tests will fail on the missing file.
# THE VARIANTS NEED THIS TOO. The comment above warned that enabling a
# core-version variant without giving it the same before_script leaves its a11y
# tests failing on a missing axe-core file — so each enabled variant gets it,
# through one anchor rather than three copies.
.pb-fetch-axe: &pb-fetch-axe
  before_script:
    - |
      curl -fsSL --retry 3 --retry-delay 2 \
        "https://cdn.jsdelivr.net/npm/axe-core@${PB_AXE_CORE_VERSION}/axe.min.js" \
        -o "${PB_AXE_CORE_PATH}"
    - test -s "${PB_AXE_CORE_PATH}"

phpunit:
  <<: *pb-fetch-axe

"phpunit (previous minor)":
  <<: *pb-fetch-axe

"phpunit (next major)":
  <<: *pb-fetch-axe
