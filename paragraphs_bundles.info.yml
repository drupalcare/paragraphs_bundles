name: 'Paragraphs Bundles'
type: module
description: 'A suite of Paragraph bundles. v2 — modernized for Drupal 11.3+ / 12; OOP hooks; per-paragraph dynamic CSS files (no inline styles); deliberately un-layered CSS so editor choices win under any theme; BEM-strict class naming.'
core_version_requirement: ^11.3 || ^12
lifecycle: stable
package: 'Paragraphs Bundles'
dependencies:
  - drupal:block
  - drupal:field
  - drupal:file
  - drupal:filter
  - drupal:image
  - drupal:link
  - drupal:media
  - drupal:media_library
  - drupal:options
  - drupal:system
  - drupal:text
  - drupal:user
  - drupal:views
  - entity_reference_revisions:entity_reference_revisions
  - paragraphs:paragraphs
  - field_group:field_group
