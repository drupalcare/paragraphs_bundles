# Default-value schema for the module's custom field types.
#
# Drupal validates each item of a field's `default_value` against
# `field.value.{field_type}` (a mapping). Both custom types ship a default
# value, so both need this entry — without it, config install fails under
# strict config-schema checking (drupal.org / Kernel + Functional tests).
field.value.paragraphs_bundles_rgb:
  type: mapping
  label: 'Default value'
  mapping:
    value:
      type: string
      label: 'Value'

# Opacity 0-100. RangeItem stores an `int` column and declares an `integer`
# property, so the default value must be typed and written as an integer too.
# A quoted '100' in a field.field.*.yml fails strict config-schema validation.
field.value.paragraphs_bundles_range:
  type: mapping
  label: 'Default value'
  mapping:
    value:
      type: integer
      label: 'Value'

# No formatter or widget in this project declares defaultSettings() any more,
# so none needs a `field.formatter.settings.*` entry here.
#
# `color_swatch_formatter` was the only one that did. It was REMOVED 2026-09-24
# on the maintainer's decision, together with the four inline `style`
# attributes it emitted from PHP render arrays — three entirely static, one
# carrying an arbitrary user-chosen hex that a field formatter has nowhere to
# put, since unlike a paragraph it has no per-entity generated CSS file. It was
# assigned to zero displays and the same field type still ships
# ColorTextFormatterHEX and ColorTextFormatterRGB, neither of which inlines
# anything. See PbInlineAssetSurfaceTest for the guard that now reads empty.
