  'pb_content:create_sections':
    return_directly: 0
    require_usage: 0
    description_override: ''
    progress_message: 'Creating the sections…'
    use_artifacts: 0
  'pb_content:list_bundles':
    return_directly: 0
    require_usage: 0
    description_override: ''
    progress_message: 'Looking at what this site has…'
    use_artifacts: 0
  'pb_content:describe_bundle':
    return_directly: 0
    require_usage: 0
    description_override: ''
