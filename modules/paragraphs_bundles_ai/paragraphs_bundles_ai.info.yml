name: 'Paragraphs Bundles AI'
type: module
description: 'Optional. Adds a bar to the foot of a page you can edit: choose a section, say what it should say, and it is written for you. Uses the contrib AI module (drupal/ai). Paragraphs Bundles works exactly as before without it.'
package: 'Paragraphs Bundles'
# The Extend page's Configure link: the AI providers page, where a provider
# and its key are set up. This module keeps no settings or key of its own.
configure: ai.admin_providers

# NOT `^11.3 || ^12`, and the difference is deliberate rather than an oversight.
#
# The parent advertises `^11.3 || ^12`. This module cannot, because it
# hard-depends on `ai:ai`, and drupal/ai 1.5.0-rc1 declares
# `core_version_requirement: ^10.5 || ^11.2` (measured 2026-09-04 in
# web/modules/contrib/ai/ai.info.yml). Claiming `^12` here would advertise a
# compatibility the dependency does not have: the module would be offered on a
# Drupal 12 site and fail at install, which is worse than not being offered at
# all. That is the same defect class as a module fatalling on a core version it
# claims — see docs/PB-AI-BRIEF.md.
#
# The intersection of `^11.3` (parent) and `^11.2` (ai) is `^11.3`.
#
# THIS COSTS THE PARENT NOTHING, which is the point of shipping the AI features
# as a separate optional module rather than folding them into
# paragraphs_bundles: a Drupal 12 site installs paragraphs_bundles and simply
# does not get this one. Widen this line the day drupal/ai declares `^12`.
core_version_requirement: ^11.3

# Both are hard dependencies, and that is correct precisely BECAUSE this module
# is itself optional. An optional service reference (`@?ai.provider`) inside the
# parent could consume drupal/ai when a site happens to have it, but it cannot
# tell Composer or the module installer that drupal/ai is what makes the
# feature work. The parent must stay installable with neither.
#
# ai_assistant_api, ai_agents and ai_chatbot are NOT needed, and that is the
# point of this design. This module talks to drupal/ai directly: it hands the
# model a JSON schema built from one bundle's own fields and asks only for the
# words. There is no assistant entity to create and no agent to wire up — the
# setup step that every site got wrong when this module shipped a chat bar.
dependencies:
  - paragraphs_bundles:paragraphs_bundles
  - ai:ai
  # DECLARED BECAUSE THIS MODULE'S OWN CONFIG NAMES THEM, not because a sibling
  # happens to pull them in today. `ai_image_bundle` — the media-less fallback,
  # for a site that has no Media module — ships a plain image field, and its
  # storage, field, form display and view display name `image`, `file` and
  # `paragraphs` between them.
  #
  # WHY THESE HAVE TO BE WRITTEN DOWN, measured 2026-09-17: Drupal skips
  # optional config whose dependencies are unmet SILENTLY, and `drush en` still
  # reports success. Without these three, `ai_image_bundle` would install with
  # no field at all and nothing would say so. PbModuleDependencyTest went red
  # on exactly this and named all three — the config was added a day before the
  # declaration, and only the test caught the gap.
  - drupal:image
  - drupal:file
  - paragraphs:paragraphs
