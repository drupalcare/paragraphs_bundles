services:
  # The resolver is a service, not logic inside the tool plugin, for two
  # reasons: it can be tested without the AI stack, and `create_sections`
  # re-checks by calling it rather than trusting that the model called
  # `resolve_target` first. See docs/PB-AI-BRIEF.md section 5.
  paragraphs_bundles_ai.target_resolver:
    class: Drupal\paragraphs_bundles_ai\Service\TargetResolver
    arguments:
      - '@entity_type.manager'
      - '@entity_field.manager'
      - '@current_user'

  Drupal\paragraphs_bundles_ai\Service\TargetResolverInterface: '@paragraphs_bundles_ai.target_resolver'

  # The only service that writes. It takes the resolver as a dependency and
  # re-runs it, so a model that skips `resolve_target` cannot cause a bad
  # write — the redundancy IS the safety model, not belt-and-braces.
  paragraphs_bundles_ai.section_writer:
    class: Drupal\paragraphs_bundles_ai\Service\SectionWriter
    calls:
      - [setStringTranslation, ['@string_translation']]
    arguments:
      - '@entity_type.manager'
      - '@current_user'
      - '@paragraphs_bundles_ai.target_resolver'

  Drupal\paragraphs_bundles_ai\Service\SectionWriterInterface: '@paragraphs_bundles_ai.section_writer'

  # Reads only, and the one every other service should ask before it guesses at
  # a field name. The content/display split it reports comes from the INSTALLED
  # form display, not from the module's shipped files, because the site a
  # person is looking at is the one the assistant has to describe.
  paragraphs_bundles_ai.bundle_profiler:
    class: Drupal\paragraphs_bundles_ai\Service\BundleProfiler
    arguments:
      - '@entity_type.manager'
      - '@entity_field.manager'

  Drupal\paragraphs_bundles_ai\Service\BundleProfilerInterface: '@paragraphs_bundles_ai.bundle_profiler'

  # Reads only. It answers "what does this section hold, and will this text
  # fit" — the two things nothing else in the module can tell a caller, and
  # both of which a model otherwise guesses.
  paragraphs_bundles_ai.field_drafter:
    class: Drupal\paragraphs_bundles_ai\Service\FieldDrafter
    calls:
      - [setStringTranslation, ['@string_translation']]
    arguments:
      - '@entity_type.manager'
      - '@entity_field.manager'

  Drupal\paragraphs_bundles_ai\Service\FieldDrafterInterface: '@paragraphs_bundles_ai.field_drafter'

  # Keeps a text field's format when its words are replaced. Both the composer
  # and the editor hand plain strings to set(), which drops the format and
  # leaves the body rendering through the site's fallback format — measured on
  # a real value, 'basic_html' -> NULL. One owner, so the two cannot drift.
  # The '@?' is not decoration: filter.module is NOT a dependency of this
  # module, and the repository only exists from Drupal 11.4 while this module
  # supports ^11.3. An optional reference resolves to NULL in both of those
  # cases, and the service falls back to the deprecated function it replaces.
  paragraphs_bundles_ai.text_formats:
    class: Drupal\paragraphs_bundles_ai\Service\TextFormats
    arguments:
      - '@current_user'
      - '@entity_type.manager'
      - '@?Drupal\filter\FilterFormatRepositoryInterface'

  Drupal\paragraphs_bundles_ai\Service\TextFormatsInterface: '@paragraphs_bundles_ai.text_formats'

  # Tells a person what to say for the section they just chose, so the one empty
  # box stops being a guess. Built from the bundle's real fields rather than a
  # hand-written map, which would be a second home for what the profiler
  # already owns and wrong the first time a site added a field.
  paragraphs_bundles_ai.prompt_hints:
    class: Drupal\paragraphs_bundles_ai\Service\PromptHints
    calls:
      - [setStringTranslation, ['@string_translation']]
    arguments:
      - '@paragraphs_bundles_ai.bundle_profiler'

  Drupal\paragraphs_bundles_ai\Service\PromptHintsInterface: '@paragraphs_bundles_ai.prompt_hints'

  # The brief a person reads before typing: the category, what the section is
  # good for, the practices, and the example prompt. CONFIG, NOT CODE — the
  # text is the maintainer's to edit in one file, and typing every string as
  # label/text in the schema is what lets `locale` translate it. Read through
  # config.factory rather than the YAML directly, because the factory is what
  # applies a site's overrides and the active language's translation.
  #
  # No '@string_translation': this service translates nothing itself. Every
  # string it returns came from config a human wrote.
  paragraphs_bundles_ai.briefs:
    class: Drupal\paragraphs_bundles_ai\Service\Briefs
    arguments:
      - '@config.factory'

  Drupal\paragraphs_bundles_ai\Service\BriefsInterface: '@paragraphs_bundles_ai.briefs'

  # Supplies the picture the module ships, for a required image field that a
  # model cannot fill — an image is chosen, not composed. Measured 2026-09-17:
  # 8 of PB's bundles have a required image, and without this the assistant
  # produced a hero with real copy, no picture, and nothing saying so.
  #
  # The '@?' on file.repository is the same reasoning as text_formats above:
  # this module does not depend on the File module, and an optional reference
  # resolves to NULL instead of refusing to compile the container. Media is
  # never injected at all — it is checked for at runtime, because the whole
  # point of ai_image_bundle is that a site may not have it.
  paragraphs_bundles_ai.default_image:
    class: Drupal\paragraphs_bundles_ai\Service\DefaultImage
    calls:
      - [setStringTranslation, ['@string_translation']]
    arguments:
      - '@entity_type.manager'
      - '@extension.list.module'
      - '@file_system'
      - '@?file.repository'

  Drupal\paragraphs_bundles_ai\Service\DefaultImageInterface: '@paragraphs_bundles_ai.default_image'

  # What size each picture field is shown at, read from its formatter, view
  # mode and image style — never a hand-written list.
  paragraphs_bundles_ai.picture_shapes:
    class: Drupal\paragraphs_bundles_ai\Service\PictureShapes
    arguments:
      - '@entity_type.manager'

  Drupal\paragraphs_bundles_ai\Service\PictureShapesInterface: '@paragraphs_bundles_ai.picture_shapes'

  # Creates a section WITH its content and its children. It writes nothing
  # itself: every value is checked against the real fields first, and then the
  # section writer attaches it, so the three rules about publishing, revisions
  # and appending stay in exactly one place.
  paragraphs_bundles_ai.section_composer:
    class: Drupal\paragraphs_bundles_ai\Service\SectionComposer
    calls:
      - [setStringTranslation, ['@string_translation']]
    arguments:
      - '@paragraphs_bundles_ai.bundle_profiler'
      - '@paragraphs_bundles_ai.field_drafter'
      - '@paragraphs_bundles_ai.section_writer'
      - '@paragraphs_bundles_ai.text_formats'
      - '@paragraphs_bundles_ai.default_image'
      - '@paragraphs_bundles_ai.picture_shapes'

  Drupal\paragraphs_bundles_ai\Service\SectionComposerInterface: '@paragraphs_bundles_ai.section_composer'

  # Decides whether the assistant appears on a page being VIEWED. Five
  # conditions, none of them visible from the page, and the reason travels with
  # the answer so "nothing appeared" is a sentence rather than a mystery.
  paragraphs_bundles_ai.page_surface:
    class: Drupal\paragraphs_bundles_ai\Service\PageSurface
    arguments:
      - '@entity_field.manager'
      - '@config.factory'
      - '@current_user'

  Drupal\paragraphs_bundles_ai\Service\PageSurfaceInterface: '@paragraphs_bundles_ai.page_surface'

  # Fills the two dropdowns: the parents a person may add, and the sections
  # already on this page. Both built on the server, so the model is handed a
  # machine name and a paragraph id rather than asked to guess either.
  paragraphs_bundles_ai.section_catalog:
    class: Drupal\paragraphs_bundles_ai\Service\SectionCatalog
    arguments:
      - '@paragraphs_bundles_ai.bundle_profiler'
      - '@entity_field.manager'
      - '@paragraphs_bundles.bundle_slugger'

  Drupal\paragraphs_bundles_ai\Service\SectionCatalogInterface: '@paragraphs_bundles_ai.section_catalog'

  # What goes inside a section, slot by slot: the field's own restriction, then
  # the briefs' nesting list. Asked by the form ("How many") and the drafter.
  paragraphs_bundles_ai.child_slots:
    class: Drupal\paragraphs_bundles_ai\Service\ChildSlots
    arguments:
      - '@paragraphs_bundles_ai.bundle_profiler'
      - '@paragraphs_bundles_ai.briefs'

  Drupal\paragraphs_bundles_ai\Service\ChildSlotsInterface: '@paragraphs_bundles_ai.child_slots'

  # The display features a new section is switched on with, from the briefs,
  # held to the real fields; and the sentence that tells the person so.
  paragraphs_bundles_ai.section_features:
    class: Drupal\paragraphs_bundles_ai\Service\SectionFeatures
    calls:
      - [setStringTranslation, ['@string_translation']]
    arguments:
      - '@paragraphs_bundles_ai.briefs'
      - '@entity_field.manager'

  Drupal\paragraphs_bundles_ai\Service\SectionFeaturesInterface: '@paragraphs_bundles_ai.section_features'

  # Asks the model for the words, inside a JSON schema built from the bundle's
  # own fields. It never chooses a section or a page: both come from the person.
  paragraphs_bundles_ai.section_drafter:
    class: Drupal\paragraphs_bundles_ai\Service\SectionDrafter
    calls:
      - [setStringTranslation, ['@string_translation']]
    arguments:
      - '@paragraphs_bundles_ai.bundle_profiler'
      - '@config.factory'
      - '@ai.provider'
      - '@paragraphs_bundles_ai.child_slots'

  Drupal\paragraphs_bundles_ai\Service\SectionDrafterInterface: '@paragraphs_bundles_ai.section_drafter'

  # The named looks. Reads config a person wrote, and filters each preset to
  # the fields the chosen bundle actually has — which is what lets one preset
  # apply to all 35 sections with a Display tab.
  paragraphs_bundles_ai.style_presets:
    class: Drupal\paragraphs_bundles_ai\Service\StylePresets
    arguments:
      - '@config.factory'

  Drupal\paragraphs_bundles_ai\Service\StylePresetsInterface: '@paragraphs_bundles_ai.style_presets'

  # Changes the words in ONE section the person pointed at. It proves the
  # section is on the page being viewed before touching it, writes a new
  # paragraph revision and then a new node revision, and returns the revision
  # number so the change can be undone.
  paragraphs_bundles_ai.section_editor:
    class: Drupal\paragraphs_bundles_ai\Service\SectionEditor
    calls:
      - [setStringTranslation, ['@string_translation']]
    arguments:
      - '@entity_type.manager'
      - '@paragraphs_bundles_ai.bundle_profiler'
      - '@paragraphs_bundles_ai.field_drafter'
      - '@current_user'
      - '@paragraphs_bundles_ai.text_formats'

  Drupal\paragraphs_bundles_ai\Service\SectionEditorInterface: '@paragraphs_bundles_ai.section_editor'

  # Puts the assistant at the foot of a page being viewed. Hook classes are
  # services in Drupal 11's OOP hook system, and this one takes the surface
  # rather than reaching for \Drupal::service().
  Drupal\paragraphs_bundles_ai\Hook\PbAiPageHook:
    autowire: true

  # Ready-made sections other modules offer in the bar (SectionSourceInterface).
  # A module tags its service `paragraphs_bundles_ai.section_source`; with none
  # tagged, the bar lists only this site's bundles, as before.
  paragraphs_bundles_ai.section_sources:
    class: Drupal\paragraphs_bundles_ai\SectionSource\SectionSources
    arguments:
      - !tagged_iterator paragraphs_bundles_ai.section_source

  Drupal\paragraphs_bundles_ai\SectionSource\SectionSources: '@paragraphs_bundles_ai.section_sources'
