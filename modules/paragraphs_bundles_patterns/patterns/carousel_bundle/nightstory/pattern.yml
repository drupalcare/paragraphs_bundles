label: 'Nightstory'
description: 'Two tall photo cards with text on a dark scrim, story bars over the photos and a headline that rises word by word.'
weight: 4
stage: open
ground: dark
placement: outer-margin
serves: [creative, events, publication]
needs:
  - 'Keep at least four Image slides with dark images, each with a title. The story bars and timing are set for you.'
settings:
  pb_display_vertical_carousel: horizontal
  pb_display_carousel_breakpoints: pb__768
  pb_display_navigation: both
  pb_display_big_screen: 2
  pb_display_small_screen: 1
  pb_display_carousel_play_stop: 6000
  pb_display_activate_looping: 1
  pb_display_carousel_arrows_over: 0
pictures:
  image_bundle.pb_content_image:
    style: pb_responsive_image_narrow
    responsive: true
    view_mode: pb_media_responsive_narrow
